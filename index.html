  /* Treemap: area is a size measure, colour is a second measure */

  /* Flow (Sankey) with fixed columns: nodes {id,label,col,color}, links {s,t,v} */

<script>/* UniFirst fiscal 2026 Form 10-K, by job function. Every number comes from the attached datasets, which hold figures as filed. */
(function () {

  function card(parent, o) {

  rule(/^Rental merchandise in service/, (o) => spec(o, { src: SF, go: 'inventory', kicker: 'Working capital', def: 'Garments and other items out with customers, amortized straight line over six to thirty-six months.', why: 'It grew 7.4%, about twice revenue. The filing says cash used rose $26.8 million because garments were installed for several large customers.', ask: ['What is the average installed life against the amortization life, and who tracks it?'], caveat: 'Amortization sits in cost of revenues, so part of the cost line is a stock of garments, not a cash cost.' }));
  rule(/^Operating cash flow/, (o) => spec(o, { src: SF, go: 'finance', kicker: 'Cash', def: 'Net cash provided by operating activities.', chart: { h: 'Operating cash flow and capital spending', fn: (el) => VZ.bars(el, { labels: YRS.map(FY), h: 200, yl: 66, min: 0, fmt: fm, tipFmt: fm, series: [{ name: 'Operating cash flow', color: C(0), vals: YRS.map((y) => D.CF[y].cfo) }, { name: 'Capital spending', color: C(3), vals: YRS.map((y) => D.CF[y].capex) }], aria: 'Cash flow' }) }, why: 'The $91.6 million fall comes from lower net income, more cash used for rental merchandise in service, taxes, receivables and inventories (10-K p. 34).', ask: ['Which of these swings reverse next year and which are structural?'] }));
  rule(/^Free cash flow/, (o) => spec(o, { src: SF, go: 'finance', kicker: 'Cash', def: 'Operating cash flow less capital expenditures, including capitalized software. An analyst measure, not reported by the company.', tables: [{ h: 'Three years', cols: [{ h: 'Year', k: (r) => `<b>${FY(r)}</b>` }, { h: 'Operating cash flow', cls: 'num', k: (r) => fm(D.CF[r].cfo) }, { h: 'Capex', cls: 'num', k: (r) => fm(D.CF[r].capex) }, { h: 'Free cash flow', cls: 'num', k: (r) => fm(D.fcf[r]) }], rows: YRS }], why: 'Free cash flow halved, from $142.5 million to $70.8 million, while buybacks and dividends continued.' }));
  rule(/^Purchase commitments/, (o) => spec(o, { src: SK, go: 'planning', kicker: 'Planning', def: 'Non-cancellable purchase commitments for inventories, software and services.', tables: [{ h: 'Payment timing', cols: [{ h: 'When', k: (r) => `<b>${r[0]}</b>` }, { h: 'Amount', cls: 'num', k: (r) => fm(r[1]) }], rows: commitRows() }], why: 'Seventy-two percent falls due within a year, which sets the floor for near-term inventory and system spend.', ask: ['How much of the $73.9 million is garments and raw materials, and how much is software?'], caveat: 'Page 67. The split between inventory and software is not given.' }));
  rule(/^In-house garments/, (o) => spec(o, { src: SK, go: 'sourcing', kicker: 'Sourcing', def: 'Share of garments placed in service that UniFirst made itself in fiscal 2026.', tables: [factTable('Manufacturing')], why: 'A 65% in-house share means plant location, raw-material supply and subcontractor balance matter more to cost than purchased garment price.', ask: ['How is work split between plants and subcontractors when demand changes?'], caveat: 'No output, utilization or cost by plant is disclosed.' }));
  rule(/^Material weakness/, (o) => spec(o, { src: SK, go: 'controls', kicker: 'Controls', def: 'A deficiency in internal control over financial reporting that the company and its auditor judged significant. It is a control finding; the filing says no misstatement was identified.', tables: [factTable('Controls')], why: 'It sits on the same systems a distribution analyst uses, the new warehouse system and legacy inventory applications, so data from them needs checking before it is trusted.', ask: ['Which inventory reports are safe to use now, and which are reconciled by hand?'] }));

  rule(/^Capital spending$/, (o) => spec(o, { src: SF, go: 'planning', kicker: 'Planning', def: 'Capital expenditures, including capitalized software costs, from the cash flow statement.', tables: [{ h: 'By segment', cols: [{ h: 'Segment', k: (r) => `<b>${esc(SEGSHORT[r])}</b>` }, { h: 'FY25', cls: 'num', k: (r) => fm(D.SEG[2025][r].capex) }, { h: 'FY26', cls: 'num', k: (r) => fm(D.SEG[2026][r].capex) }], rows: SEGS }], why: 'Spending fell in each of the last two years while the ERP and warehouse systems were being rolled out.', ask: ['How much of the $123.9 million in Uniform & Facility is systems, plants and distribution?'] }));
  rule(/^Net income$/, (o) => spec(o, { src: SF, go: 'finance', kicker: 'Profit', def: 'Net income for the 52 weeks ended August 29, 2026.', tables: [{ h: 'Three years', cols: [{ h: 'Year', k: (r) => `<b>${FY(r.year)}</b>` }, { h: 'Net income', cls: 'num', k: (r) => fm(r.netinc) }], rows: isRows() }], why: 'Net income fell 26.2%, in step with operating income.' }));
  rule(/^Cost of revenues share$/, (o) => spec(o, { src: SK, go: 'finance', kicker: 'Cost', def: 'Cost of revenues divided by revenue. It includes service labor, production, healthcare claims and merchandise amortization.', tables: [factTable('Finance').slice ? { h: 'What the filing says', cols: [{ h: 'Statement', k: (r) => esc(r.text) }, { h: 'Page', cls: 'num', k: (r) => r.page }], rows: D.F.filter((r) => r.fn === 'Finance' && /Cost of revenues/.test(r.text)) } : null].filter(Boolean), why: 'Flat at 63.4%, so cost of revenues did not cause the margin fall.' }));
  rule(/^Selling and admin share$/, (o) => spec(o, { src: SK, go: 'finance', kicker: 'Cost', def: 'Selling and administrative expenses divided by revenue.', tables: [{ h: 'What the filing says', cols: [{ h: 'Statement', k: (r) => esc(r.text) }, { h: 'Page', cls: 'num', k: (r) => r.page }], rows: D.F.filter((r) => r.fn === 'Finance' && /Selling and administrative/.test(r.text)) }], why: 'This is where the margin fell: 25.6% of revenue against 23.2%.' }));
  rule(/^Merger costs in fiscal 2026$/, (o) => spec(o, { src: SK, go: 'merger', kicker: 'Merger', def: 'Legal, advisory and other professional fees tied to the proposed merger with Cintas, recorded in selling and administrative expenses.', tables: [{ h: 'What the filing says', cols: [{ h: 'Statement', k: (r) => esc(r.text) }, { h: 'Page', cls: 'num', k: (r) => r.page }], rows: D.F.filter((r) => r.fn === 'Merger') }], why: 'These costs explain most of the operating income decline and are not part of day-to-day distribution performance.' }));
  rule(/^Termination fee$/, (o) => spec(o, { src: SK, go: 'merger', kicker: 'Merger', def: 'Fee UniFirst would owe Cintas if the merger agreement were terminated under specified circumstances.', why: 'It is about 1.6 times fiscal 2026 operating income, so the deal outcome matters for everything planned in the interim.' }));
  const commitRows = () => [['Within one year', D.K.commit_lt1], ['One to three years', D.K.commit_1_3], ['Three to five years', +(D.K.commit_total - D.K.commit_lt1 - D.K.commit_1_3).toFixed(1)]];

  /* ---------------------------------------------------------- pages */
  function pOverview(g) {
    const a = D.IS[2026], b = D.IS[2025], K = D.K;
    const tiles = mk('div', 'nd-tiles'); g.appendChild(tiles);
    tile(tiles, { label: 'Revenue', b: 'real', value: fm(a.revenue), delta: dlt(a.revenue, b.revenue, { better: 'up' }), sub: 'Fiscal 2026, 52 weeks to Aug 29, 2026' });
    tile(tiles, { label: 'Operating income', b: 'real', value: fm(a.opinc), delta: dlt(a.opinc, b.opinc, { better: 'up' }), sub: `${P1(a.opinc / a.revenue)} margin against ${P1(b.opinc / b.revenue)}` });
    tile(tiles, { label: 'Operating income before merger costs', b: 'calc', value: fm(D.exMerger), sub: `${P1(D.exMerger / a.revenue)} margin; adds back ${fm(K.merger_cost)}` });
    tile(tiles, { label: 'Inventories', b: 'real', value: fm(D.BS.Inventories.fy2026), delta: dlt(D.BS.Inventories.fy2026, D.BS.Inventories.fy2025, { better: null }), sub: `${P1(D.invRatio[1])} of revenue against ${P1(D.invRatio[0])}` });
    tile(tiles, { label: 'Operating cash flow', b: 'real', value: fm(D.CF[2026].cfo), delta: dlt(D.CF[2026].cfo, D.CF[2025].cfo, { better: 'up' }), sub: 'Net cash from operating activities' });
    tile(tiles, { label: 'Free cash flow', b: 'calc', value: fm(D.fcf[2026]), delta: dlt(D.fcf[2026], D.fcf[2025], { better: 'up' }), sub: 'Operating cash flow less capital spending' });
    const b1 = card(g, { t: 'What moved operating income, fiscal 2025 to 2026', b: 'calc', n: `Revenue grew $90.9 million; costs grew faster. Merger costs of ${fm(K.merger_cost)} are named in the filing (${pg(33)}); other selling and administrative growth includes ${fm(K.proxy_cost)} of proxy costs.`, s: 'uf10k_fin', span: 7, mh: 280 });
    const dr = a.revenue - b.revenue, dc = -(a.cor - b.cor), dsm = -K.merger_cost, dso = -((a.sga - b.sga) - K.merger_cost), dd = -(a.da - b.da);
    VZ.waterfall(b1, { steps: [{ label: 'FY25 operating income', v: b.opinc, total: true }, { label: 'Revenue growth', v: dr }, { label: 'Cost of revenues', v: dc }, { label: 'Merger costs', v: dsm }, { label: 'Other selling and admin', v: dso }, { label: 'Depreciation and amortization', v: dd }, { label: 'FY26 operating income', v: a.opinc, total: true }], h: 280, fmt: fm, tipFmt: fm, aria: 'Operating income bridge' });
    const b2 = card(g, { t: 'Revenue by segment', b: 'real', n: 'Uniform & Facility Service Solutions is 91% of revenue and includes the distribution center, manufacturing planning and materials management.', s: 'uf10k_fin', span: 5, mh: 280 });
    VZ.bars(b2, { labels: YRS.map(FY), h: 270, yl: 66, min: 0, stack: true, fmt: fm, tipFmt: fm, series: SEGS.map((s, i) => ({ name: SEGSHORT[s], color: C(i), vals: YRS.map((y) => segRev(s, y)) })), aria: 'Revenue by segment' });
    const rows = [
      ['Planning', `${fm(K.commit_total)} of purchase commitments, 72% due within a year`, 67, 'planning'],
      ['Inventory management', `Inventory ${growthTxt(D.bsg('Inventories'))} while rental merchandise in service ${growthTxt(D.bsg('Rental merchandise in service'))}`, 40, 'inventory'],
      ['Sourcing', 'Limited raw-material suppliers; tariffs named as a cost risk', 15, 'sourcing'],
      ['Manufacturing', '65% of garments made in-house in Mexico and Nicaragua; mats in Arkansas', 6, 'sourcing'],
      ['Distribution', '444,000 sq ft Owensboro center, one of 282 facilities', 23, 'distribution'],
      ['Sales', `Revenue ${growthTxt(D.growth('revenue'))}; First Aid & Safety +10.9%`, 32, 'sales'],
      ['Finance', `Operating margin ${P1(a.opinc / a.revenue)}; free cash flow halved`, 38, 'finance'],
      ['Root cause and process', 'Material weakness now narrowed to inventory systems, including the new warehouse system', 14, 'controls']];
    const b3 = card(g, { t: 'The job, function by function, in the company’s own filing', b: 'calc', n: 'Each row is a duty from the Distribution Business Analyst job description with the strongest evidence in the 10-K. Page numbers are PDF pages.', s: 'uf10k_fin uf10k_facts', span: 12, mh: 120 });
    b3.innerHTML = VZ.table([{ h: 'Function', k: (r) => `<b>${r[0]}</b>` }, { h: 'What the filing shows', k: (r) => esc(r[1]) }, { h: 'Page', cls: 'num', k: (r) => r[2] }, { h: '', k: (r) => `<button type="button" class="nd-link" data-go="${r[3]}">Open</button>` }], rows);
    b3.querySelectorAll('[data-go]').forEach((x) => x.addEventListener('click', () => go(x.dataset.go)));
    const items = [
      { sev: 'serious', t: 'Operating income fell 26% on 3.7% revenue growth', d: `Merger costs explain ${fm(K.merger_cost)} of the ${fm(b.opinc - a.opinc)} drop. Before them, margin is ${P1(D.exMerger / a.revenue)} against ${P1(b.opinc / b.revenue)}.`, spec: () => metaFor({ label: 'Operating income before merger costs' })() },
      { sev: 'serious', t: 'Free cash flow halved to $70.8 million', d: 'Lower profit, more cash tied up in rental merchandise, receivables and taxes. Buybacks and dividends still took $57.9 million.', spec: () => metaFor({ label: 'Free cash flow' })() },
      { sev: 'watch', t: 'The control weakness now sits on inventory systems', d: 'The auditor issued an adverse opinion on internal control. The new warehouse system is named. No misstatement was found.', spec: () => metaFor({ label: 'Material weakness' })() },
      { sev: 'info', t: 'Rental merchandise grew twice as fast as revenue', d: 'Large customer installs drove it. Inventory itself was flat, so stock turned slightly faster against revenue.', spec: () => metaFor({ label: 'Rental merchandise in service' })() }];
    const b4 = card(g, { t: 'Where to look first', b: 'calc', n: 'Four findings from the filing. Select Details for the evidence and the questions to ask.', s: 'uf10k_fin uf10k_facts', span: 12, mh: 80 });
    insightList(b4, items);
  }

  function pPlanning(g) {
    const K = D.K, c26 = D.CF[2026], c25 = D.CF[2025], a = D.IS[2026], b = D.IS[2025];
    const tiles = mk('div', 'nd-tiles'); g.appendChild(tiles);
    tile(tiles, { label: 'Purchase commitments', b: 'real', value: fm(K.commit_total), sub: `${fm(K.commit_lt1)} due within one year (${P0(K.commit_lt1 / K.commit_total)})` });
    tile(tiles, { label: 'Capital spending', b: 'real', value: fm(c26.capex), delta: dlt(c26.capex, c25.capex, { better: null }), sub: 'Including capitalized software' });
    tile(tiles, { label: 'Capex as share of revenue', b: 'calc', value: P1(c26.capex / a.revenue), sub: `${P1(c25.capex / b.revenue)} in fiscal 2025` });
    tile(tiles, { label: 'Capex against depreciation and amortization', b: 'calc', value: (c26.capex / a.da).toFixed(2) + 'x', sub: `${fm(a.da)} of depreciation and amortization` });
    tile(tiles, { label: 'ERP spend capitalized', b: 'real', value: fm(K.erp_capitalized), sub: `Key Initiative expense ${fm(K.key_init_26)} against ${fm(K.key_init_25)}` });
    const b1 = card(g, { t: 'When commitments fall due', b: 'real', n: `${fm(K.commit_total)} of non-cancellable commitments for inventories, software and services (${pg(67)}).`, s: 'uf10k_facts', span: 5, mh: 180 });
    VZ.hbars(b1, { rows: commitRows().map((r, i) => ({ label: r[0], value: r[1], color: i === 0 ? C(1) : C(0) })), fmt: fm, lw: 130, aria: 'Commitments by timing' });
    const b2 = card(g, { t: 'Capital spending by segment', b: 'real', n: 'Spending fell in each of the last two years and is almost all in Uniform & Facility Service Solutions.', s: 'uf10k_fin', span: 7, mh: 240 });
    VZ.bars(b2, { labels: YRS.map(FY), h: 240, yl: 66, min: 0, stack: true, fmt: fm, tipFmt: fm, series: SEGS.map((s, i) => ({ name: SEGSHORT[s], color: C(i), vals: YRS.map((y) => D.SEG[y][s].capex) })), aria: 'Capex by segment' });
    const b3 = card(g, { t: 'Cash generated against cash invested', b: 'calc', n: 'Operating cash flow fell $91.6 million in fiscal 2026 (' + pg(34) + '). Capex fell $19.8 million.', s: 'uf10k_fin', span: 7, mh: 240 });
    VZ.bars(b3, { labels: YRS.map(FY), h: 240, yl: 66, min: 0, fmt: fm, tipFmt: fm, series: [{ name: 'Operating cash flow', color: C(0), vals: YRS.map((y) => D.CF[y].cfo) }, { name: 'Capital spending', color: C(3), vals: YRS.map((y) => D.CF[y].capex) }, { name: 'Free cash flow', color: C(2), vals: YRS.map((y) => D.fcf[y]) }], aria: 'Cash generated and invested' });
    const g0 = +pv('pl_growth', '4');
    const ctl = ctlRow(selHtml('pl_growth', 'Revenue growth next year', [['0', '0%'], ['2', '+2%'], ['4', '+4%'], ['6', '+6%']], String(g0)));
    const b4 = card(g, { t: 'Working capital a growth plan needs', b: 'scn', n: 'Holds fiscal 2026 ratios of inventory and rental merchandise to revenue constant and applies the chosen growth. A planning aid, not a forecast.', ctl, s: 'uf10k_fin', span: 5, mh: 160 });
    const rv = a.revenue * (1 + g0 / 100), inv = D.invRatio[1] * rv, msv = D.msvRatio[1] * rv;
    b4.innerHTML = outHtml([['Revenue', fm(rv)], ['Inventories needed', fm(inv)], ['Merchandise in service needed', fm(msv)], ['Added cash tied up', fm(inv + msv - D.BS.Inventories.fy2026 - D.BS['Rental merchandise in service'].fy2026)]], `Uses ${P1(D.invRatio[1])} and ${P1(D.msvRatio[1])} of revenue. Real installs are lumpy and customer specific, so the ratios will move.`);
    const b5 = card(g, { t: 'What a planner would request next', b: 'tpl', n: 'The filing gives company totals. These are the fields that turn the picture into a plan.', span: 12, mh: 100 });
    b5.innerHTML = TPL([['Install and removal schedule by customer', 'Demand for new garments and returns six months ahead'], ['Weekly garment issues and returns by item', 'Forecast error and safety stock by program'], ['Open purchase orders and supplier dates', 'Supply risk against the $73.9 million due within a year'], ['Plant capacity and output by site', 'Make against buy, 65% in-house']]);
  }

  function pInventory(g) {
    const BS = D.BS, a = D.IS[2026], b = D.IS[2025], inv = BS.Inventories, msv = BS['Rental merchandise in service'];
    const fg = D.INV.find((r) => r.item === 'Finished goods');
    const tiles = mk('div', 'nd-tiles'); g.appendChild(tiles);
    tile(tiles, { label: 'Inventories', b: 'real', value: fm(inv.fy2026), delta: dlt(inv.fy2026, inv.fy2025, { better: null }), sub: `${P1(D.invRatio[1])} of revenue against ${P1(D.invRatio[0])}` });
    tile(tiles, { label: 'Finished goods share', b: 'calc', value: P1(fg.fy2026 / inv.fy2026), sub: `${fm(fg.fy2026)} of ${fm(inv.fy2026)}` });
    tile(tiles, { label: 'Rental merchandise in service', b: 'real', value: fm(msv.fy2026), delta: dlt(msv.fy2026, msv.fy2025, { better: null }), sub: `${P1(D.msvRatio[1])} of revenue against ${P1(D.msvRatio[0])}` });
    tile(tiles, { label: 'Cash used for inventories', b: 'real', value: fm(-D.CF[2026].d_inv), sub: `Fiscal 2025 released ${fm(D.CF[2025].d_inv)}` });
    tile(tiles, { label: 'Material weakness', b: 'real', value: 'Inventory systems', sub: 'Includes the new warehouse system. No misstatement found.' });
    const b1 = card(g, { t: 'Inventory by stage', b: 'real', n: `Finished goods are the bulk; raw materials and work in process are small (${pg(47)}).`, s: 'uf10k_fin', span: 5, mh: 250 });
    VZ.bars(b1, { labels: ['FY25', 'FY26'], h: 250, yl: 66, min: 0, stack: true, fmt: fm, tipFmt: fm, series: D.INV.map((r, i) => ({ name: r.item, color: C(i), vals: [r.fy2025, r.fy2026] })), aria: 'Inventory by stage' });
    const rows = [['Revenue', D.growth('revenue')], ['Inventories', D.bsg('Inventories')], ['Rental merchandise in service', D.bsg('Rental merchandise in service')], ['Receivables', D.bsg('Receivables, net')]].map(([l, v]) => ({ label: l, value: v, color: l === 'Revenue' ? '#9aa0a6' : C(0) }));
    const b2 = card(g, { t: 'Growth in fiscal 2026: revenue against working capital', b: 'calc', n: 'Garments out with customers grew about twice as fast as revenue; stock on shelf barely grew. Accounts payable fell 0.5% and is left out.', s: 'uf10k_fin', span: 7, mh: 250 });
    VZ.hbars(b2, { rows, fmt: (v) => sgn(v * 100) + '%', max: 0.1, lw: 190, aria: 'Growth by balance sheet line' });
    const curR = (D.invRatio[1] * 100).toFixed(2), tg = +pv('inv_target', curR);
    const ctl = ctlRow(selHtml('inv_target', 'Inventory as share of revenue', [['5.0', '5.0%'], ['5.4', '5.4%'], [curR, curR + '% (fiscal 2026)'], ['6.2', '6.2%']], String(tg)));
    const b3 = card(g, { t: 'What each point of inventory is worth', b: 'scn', n: 'Cash released or absorbed if inventory sat at a different share of fiscal 2026 revenue. Use it to size the prize before asking for item-level data.', ctl, s: 'uf10k_fin', span: 5, mh: 150 });
    const tgv = tg / 100 * a.revenue;
    b3.innerHTML = outHtml([['Inventory today', fm(inv.fy2026)], [`Inventory at ${tg.toFixed(2)}% of revenue`, fm(tgv)], ['Cash released (absorbed)', fm(inv.fy2026 - tgv)], ['One point of revenue', fm(a.revenue / 100)]], 'Not a target. The filing gives no safe level, and service levels depend on item mix.');
    const b4 = card(g, { t: 'Why the data needs care: the control finding', b: 'real', n: 'What the filing says about the systems that hold inventory data.', s: 'uf10k_facts', span: 7, mh: 120 });
    b4.innerHTML = VZ.table([{ h: 'Statement', k: (r) => esc(r.text) }, { h: 'Page', cls: 'num', k: (r) => r.page }], D.F.filter((r) => r.fn === 'Controls' || r.fn === 'Inventory'));
    const b5 = card(g, { t: 'What an inventory analyst would request first', b: 'tpl', n: 'The 10-K has no days of supply because cost of revenues includes service labor and merchandise amortization.', span: 12, mh: 100 });
    b5.innerHTML = TPL([['On-hand by item and site, weekly', 'Weeks of cover, turns, excess and obsolete'], ['Issues, returns and adjustments from the warehouse system', 'Reconciliation of the warehouse system against legacy records'], ['Garment age and wear-out rates', 'Amortization life against real life'], ['Reserve for excess and obsolete by category', 'Exposure inside finished goods']]);
  }

  function pSourcing(g) {
    const K = D.K, cr = (s, y) => D.SEG[y][s].cor / D.SEG[y][s].revenue;
    const tiles = mk('div', 'nd-tiles'); g.appendChild(tiles);
    tile(tiles, { label: 'In-house garments', b: 'real', value: K.garments_in_house_pct + '%', sub: 'Of garments placed in service, fiscal 2026' });
    tile(tiles, { label: 'Bought garments', b: 'calc', value: (100 - K.garments_in_house_pct) + '%', sub: 'From industry suppliers' });
    tile(tiles, { label: 'In-house mats', b: 'real', value: K.mats_in_house_pct + '%', sub: 'Cave City, Arkansas plant' });

  /* ---------------------------------------------------------- shell */
  function init() {
    app.innerHTML = `<div class="nd"><header class="nd-head"><div><h1>UniFirst fiscal 2026 10-K, by job function</h1><p class="nd-take" id="nd-take"></p></div><div class="nd-filters"><button type="button" id="nd-reset" class="nd-link">Reset</button></div></header><nav class="nd-tabs" id="nd-tabs" aria-label="Dashboard pages"></nav><div id="nd-page"></div></div>`;
    document.getElementById('nd-tabs').innerHTML = PAGES.map((p) => `<button type="button" data-id="${p.id}" id="tab-${p.id}">${esc(p.t)}</button>`).join('');
    document.getElementById('nd-tabs').addEventListener('click', (e) => { const b = e.target.closest('button[data-id]'); if (b) go(b.dataset.id); });
    document.getElementById('nd-reset').addEventListener('click', () => dash.resetParams());
    const named = location.hash.slice(1); if (PAGES.some((p) => p.id === named)) cur = named;
  }
  function render() {
    document.querySelectorAll('#nd-tabs button').forEach((b) => b.setAttribute('aria-current', b.dataset.id === cur ? 'page' : 'false'));
    const pg = document.getElementById('nd-page'); pg.innerHTML = ''; VZ.untip();
    const g = grid(); g.id = 'page-' + cur; pg.appendChild(g);
    const fn = { overview: pOverview, planning: pPlanning, inventory: pInventory, sourcing: pSourcing, distribution: pDistribution, sales: pSales, finance: pFinance, controls: pControls, merger: pMerger, talk: pTalk }[cur];
    pg.insertBefore(mk('h2', 'nd-h2', esc(PAGES.find((p) => p.id === cur).t)), g);
    try { fn(g); enhance(g); pg.querySelectorAll('select[data-param]').forEach((sl) => sl.addEventListener('change', () => dash.setParams({ [sl.dataset.param]: sl.value }))); } catch (e) { g.innerHTML = '<p class="nd-empty">This page could not be drawn.</p>'; console.error(e); }
    document.getElementById('nd-take').textContent = `Built from UniFirst\u2019s annual report for the year ended August 29, 2026. Revenue grew ${P1(D.growth('revenue'))}, operating income fell ${P1(-D.growth('opinc'))}, and the control weakness now sits on inventory systems. Every figure cites its page in the filing.`;
  }
  dash.onData(() => {
    const st = IDS.map((id) => dash.data(id));
    if (!app.firstChild) init();
    if (st.find((s) => ['error', 'connect', 'declined', 'missing'].includes(s.status))) { document.getElementById('nd-page').innerHTML = '<p class="nd-empty">One of the data sources failed to load.</p>'; return; }
    if (st.some((s) => s.status !== 'ok')) { if (!D) document.getElementById('nd-page').innerHTML = '<div class="dash-skeleton" style="min-height:240px"></div>'; return; }
    D = prep(); render();
  });
})();
</script>
